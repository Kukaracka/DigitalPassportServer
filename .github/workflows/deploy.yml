name: Deploy to Server

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/backend:latest

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Собираем образ ОДИН раз локально
      - name: Build Docker image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_TAG }}

      # 2. Запускаем тесты (переменная IMAGE_TAG подхватится автоматически)
      - name: Run tests via Docker Compose
        run: |
          docker compose -f docker-compose.test.yml up \
            --abort-on-container-exit \
            --exit-code-from backend

      # 3. Очищаем контейнеры после тестов (теперь не упадет!)
      - name: Clean up containers
        if: always()
        run: docker compose -f docker-compose.test.yml down

      # 4. Если тесты прошли — пушим этот же готовый образ в GHCR
      - name: Push Docker image
        run: docker push ${{ env.IMAGE_TAG }}

  pull-and-restart:
    runs-on: ubuntu-latest
    needs: build-test-and-push

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/DigitalPassportServer

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            git pull

            docker compose pull backend

            docker compose up -d

            docker image prune -f
